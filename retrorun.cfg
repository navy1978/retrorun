# RetroRun desktop settings
retrorun_log_level = DEBUG
retrorun_show_loading_screen = true
# SDL only: auto, software, opengl, vulkan (Vulkan needs MoltenVK and is unavailable in this macOS build)
retrorun_video_renderer = opengl
retrorun_aspect_ratio = auto
retrorun_pixel_perfect = false
flycast_internal_resolution = 1024x768
retrorun_vsync = true
retrorun_video_filter = nearest
#off-scanlines-crt
retrorun_video_shader = scanlines
